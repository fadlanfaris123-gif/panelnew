name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Source Code
      run: unzip ffpanel_source.zip
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK
      run: |
        # Paksa Android SDK pakai versi yang udah ada di server (API 33)
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        cd ffpanel
        mkdir -p app/build
        
        # Compile resource dan link
        $ANDROID_HOME/build-tools/33.0.2/aapt2 compile --dir app/src/main/res -o app/build/res.zip
        $ANDROID_HOME/build-tools/33.0.2/aapt2 link -o app/build/app.unsigned.apk -I $ANDROID_HOME/platforms/android-33/android.jar --manifest app/src/main/AndroidManifest.xml --java app/build/gen --auto-add-overlay app/build/res.zip
        
        # Compile Java
        javac -source 1.8 -target 1.8 -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar -classpath "$ANDROID_HOME/platforms/android-33/android.jar" -d app/build/classes $(find app/src/main/java app/build/gen -name "*.java")
        
        # Convert ke DEX
        $ANDROID_HOME/build-tools/33.0.2/d8 --lib $ANDROID_HOME/platforms/android-33/android.jar --output app/build/dex $(find app/build/classes -name "*.class")
        
        # Package & Sign
        cd app/build
        cp app.unsigned.apk app.aligned.apk
        zip -j app.aligned.apk dex/classes.dex
        $ANDROID_HOME/build-tools/33.0.2/zipalign -f 4 app.aligned.apk app.aligned.zipalign.apk
        
        keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        $ANDROID_HOME/build-tools/33.0.2/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app.signed.apk app.aligned.zipalign.apk
        
        # Pindahin ke root folder workspace biar bisa diambil
        mv app.signed.apk $GITHUB_WORKSPACE/
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ffpanel-apk
        path: app.signed.apk￼Enter

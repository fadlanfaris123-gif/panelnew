name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Source Code
      run: unzip ffpanel_source.zip
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Build APK
      run: |
        cd ffpanel
        mkdir -p app/build
        aapt2 compile --dir app/src/main/res -o app/build/res.zip
        aapt2 link -o app/build/app.unsigned.apk -I $ANDROID_HOME/platforms/android-33/android.jar --manifest app/src/main/AndroidManifest.xml --java app/build/gen --auto-add-overlay app/build/res.zip
        javac -source 1.8 -target 1.8 -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar -classpath "$ANDROID_HOME/platforms/android-33/android.jar" -d app/build/classes $(find app/src/main/java app/build/gen -name "*.java")
        d8 --lib $ANDROID_HOME/platforms/android-33/android.jar --output app/build/dex $(find app/build/classes -name "*.class")
        cd app/build
        cp app.unsigned.apk app.aligned.apk
        zip -j app.aligned.apk dex/classes.dex
        zipalign -f 4 app.aligned.apk app.aligned.zipalign.apk
        keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app.signed.apk app.aligned.zipalign.apk
        mv app.signed.apk $GITHUB_WORKSPACE/
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ffpanel-apk
        path: app.signed.apk￼Enter
